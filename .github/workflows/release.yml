name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/helakit/__init__.py)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match __version__ = $PKG_VERSION in src/helakit/__init__.py." >&2
            echo "Bump the package version before tagging — PyPI rejects re-uploads of an existing version." >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          uv build
          rm -f dist/.gitignore

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  deploy-versioned-docs:
    name: Deploy versioned docs
    needs: build-and-publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes the built docs to gh-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked --extra docs --no-build

      - name: Compute MAJOR.MINOR
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          echo "MAJOR_MINOR=$MAJOR_MINOR" >> "$GITHUB_ENV"

      - name: Deploy versioned docs
        run: uv run --locked --no-build mike deploy --push --update-aliases "$MAJOR_MINOR" latest

      - name: Set default to latest
        run: uv run --locked --no-build mike set-default --push latest

  github-release:
    name: Create GitHub Release
    needs: build-and-publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
