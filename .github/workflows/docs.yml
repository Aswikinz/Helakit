name: Docs (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked --extra docs --no-build

      - name: Deploy dev docs
        run: uv run --locked --no-build mike deploy --push --update-aliases dev

      - name: Set root default to dev (only if no release exists yet)
        run: |
          if ! uv run --locked --no-build mike list 2>/dev/null | grep -qE '(^|[^a-z])latest([^a-z]|$)'; then
            uv run --locked --no-build mike set-default --push dev
          fi
